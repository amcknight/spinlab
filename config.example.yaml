emulator:
  retroarch_path: "C:/RetroArch-Win64/retroarch.exe"
  ra_core_path: "C:/RetroArch-Win64/cores/snes9x_libretro.dll"
  # RA writes save states to <savestate_dir>/<core_subdir>/. For snes9x_libretro
  # the per-core subdir is "Snes9x". Some users point savestate_dir directly at
  # the per-core path — SpinLab detects that case and doesn't double-append.
  savestate_dir: "C:/RetroArch-Win64/states"
  ra_core_subdir: "Snes9x"
  # Where SpinLab writes its segment-keyed state files (separate from RA's slot files).
  spinlab_state_dir: "data/spinlab_states"
  # Optional: explicit override for where RA writes .replay files. Usually unset
  # (derived as savestate_dir / ra_core_subdir).
  # ra_movie_dir: "C:/RetroArch-Win64/states/Snes9x"

rom:
  dir: "C:/path/to/your/romhacks"

game:
  category: "any%"

network:
  nci_port: 55355      # RetroArch Network Command Interface (UDP)
  dashboard_port: 15483
  host: "127.0.0.1"

scheduler:
  estimator: kalman
  allocator: greedy
  auto_advance_delay_s: 2.0

data:
  dir: "data"

# Physical-gamepad menu (optional; requires `pip install -e ".[gamepad]"`).
# Reads the controller directly, not the emulated SNES input. Button ids are
# pygame indices and vary per controller/mode and your RetroArch remaps — run
# `spinlab gamepad-probe` to discover them. Pick a no-game-function button for
# `modifier` (e.g. a stick click) since it is HELD to open the menu.
# gamepad:
#   enabled: true
#   device_index: 0
#   modifier: 8
#   buttons:
#     pause: 9
#     toggle_science: 10
#     toggle_practice: 11
#     prev_segment: 4
#     next_segment: 5
